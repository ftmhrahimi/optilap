<!--
  SYNTHETIC JavanElectronic search results, mirroring the REAL card structure:
    li[data-prdid]  -> one product card
    span[data-prdtype] -> Original / Copy / Renew (Renew = Refurbished)
    .en-num > div (x3) -> title, brand, package
    .px-01 + .small -> price number + currency (only when in stock)
    availability text -> in-stock / "ناموجود-تحویل N روزه" / "در حال تامین"
-->
<html lang="fa" dir="rtl">
  <body>
    <ul class="products">
      <li data-bsktype="shopping" data-prdid="18299">
        <div><div>
          <a href="https://www.javanelec.com/shop/product/18299/stmicroelectronics/lm358d">
            <img title="LM358D" src="https://www.javanelec.com/stfiles/lm358d.jpg"/></a>
          <span data-prdtype="Original">اوریجینال</span>
        </div>
        <div class="h7">
          <div class="en-num"><div>LM358D</div><div>STMicroelectronics</div><div>SO-8</div></div>
          <div class="flex-column"><span><span class="px-01 font-weight-bold">113,000</span><span class="small">ریال</span></span>
            <span class="add-cart"><span class="pl-03">اضافه به سبد خرید</span></span>
          </div>
        </div></div>
      </li>
      <li data-bsktype="shopping" data-prdid="34992">
        <div><div>
          <a href="https://www.javanelec.com/shop/product/34992/stmicroelectronics/lm358n"><img title="LM358N"/></a>
          <span data-prdtype="Copy">کپی</span>
        </div>
        <div class="h7">
          <div class="en-num"><div>LM358N</div><div>STMicroelectronics</div><div>DIP-8</div></div>
          <div class="flex-column"><div>ناموجود-تحویل 31 روزه</div>
            <span class="add-cart"><span>اضافه به سبد سفارش</span></span>
          </div>
        </div></div>
      </li>
      <li data-bsktype="shopping" data-prdid="26002">
        <div><div>
          <a href="https://www.javanelec.com/shop/product/26002/texas-instruments/lm358p"><img title="LM358P"/></a>
          <span data-prdtype="Renew">بازسازی شده</span>
        </div>
        <div class="h7">
          <div class="en-num"><div>LM358P</div><div>Texas Instruments</div><div>DIP-8</div></div>
          <div class="flex-column"><div>در حال تامین - پیش خرید کنید</div></div>
        </div></div>
      </li>
    </ul>
  </body>
</html>
